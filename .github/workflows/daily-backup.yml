name: Daily Database Backup (20:00 TRT)

on:
  schedule:
    # 17:00 UTC = 20:00 Turkey time.
    - cron: '0 17 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Daily 20:00 Snapshot
        run: |
          echo "Triggering 20:00 TRT database backup snapshot..."
          curl --silent --show-error --fail-with-body --connect-timeout 15 --max-time 90 -X POST "https://inegol-cozum-kurs.pages.dev/api/backup" \
            -H "Authorization: Bearer ${{ secrets.BACKUP_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"notes": "GitHub Actions 20:00 TRT Günlük Otomatik Snapshot"}'
          echo "Triggered successfully."
